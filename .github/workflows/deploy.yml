name: Publish BlueOS extension

on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ixian-ukraine/blueos-extensions/.github/workflows/publish-extension.yml@main
    with:
      identifier: ixian-ukraine.mediamtx
      name: MediaMTX (Ixian)
      description: RTSP camera relay, WebRTC grid viewer, and configuration editor for BlueOS.
      web-port: 8908
